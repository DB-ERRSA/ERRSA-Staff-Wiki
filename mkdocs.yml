hooks:
  - hooks.py

not_in_nav: |
  /plugins/legacy/*.md

site_name: ERRSA Staff Wiki
site_description: ERRSA Minecraft staff procedures, learning, tools and troubleshooting.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.prune
    - content.tooltips
    - navigation.path
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

  palette:
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Dark mode

extra_javascript:
  - assets/javascripts/wiki-editor.js
  - assets/javascripts/plugin-preview.js
  - assets/javascripts/preview-click.js
  - assets/javascripts/wiki-sync.js
  - assets/javascripts/wiki-live-pages.js
  - assets/javascripts/wiki-tag-colors.js

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/permissions-model.css

plugins:
  - search
  - typeset
  - tags
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      enable_git_follow: false
      fallback_to_build_date: true
      timezone: America/New_York

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

