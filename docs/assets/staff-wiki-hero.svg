<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
<title id="title">Floating Minecraft inspired island</title>
<desc id="desc">A small floating landscape and glowing beacon beneath a night sky.</desc>
<defs>
 <radialGradient id="a"><stop stop-color="#5fd6bb" stop-opacity=".25"/><stop offset="1" stop-color="#5fd6bb" stop-opacity="0"/></radialGradient>
 <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#112f42"/><stop offset=".58" stop-color="#12333f"/><stop offset="1" stop-color="#0a2635"/></linearGradient>
 <linearGradient id="grass" x2=".8" y2="1"><stop stop-color="#69c9a0"/><stop offset="1" stop-color="#2f8b79"/></linearGradient>
 <linearGradient id="earth" x2="0" y2="1"><stop stop-color="#487574"/><stop offset="1" stop-color="#193a49"/></linearGradient>
 <linearGradient id="beam" x2="0" y2="1"><stop stop-color="#baf4db" stop-opacity="0"/><stop offset=".66" stop-color="#9ff2d0" stop-opacity=".24"/><stop offset="1" stop-color="#d8ffeb" stop-opacity=".56"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="17"/></filter>
</defs>
<rect width="720" height="500" fill="url(#sky)"/>
<circle cx="365" cy="250" r="250" fill="url(#a)"/>
<ellipse cx="363" cy="402" rx="221" ry="38" fill="#7df1c2" opacity=".23" filter="url(#blur)"/>
<path d="M327 20h76l-16 255h-44z" fill="url(#beam)"/>
<!-- The island uses an isometric top plane and layered earth facets. -->
<path d="M118 258 357 163 612 255 377 363Z" fill="url(#grass)" stroke="#a8e7bf" stroke-width="3"/>
<path d="M118 258 377 363 377 417 118 311Z" fill="#245b60" stroke="#4b9582" stroke-width="2"/>
<path d="M377 363 612 255 612 306 377 417Z" fill="url(#earth)" stroke="#4b9582" stroke-width="2"/>
<path d="M154 267 355 188 575 265 375 346Z" fill="#3e927e" opacity=".33"/>
<!-- Central beacon plinth -->
<path d="m306 252 60-25 65 24-61 27Z" fill="#b8d9bd"/>
<path d="m306 252 64 26v28l-64-25Z" fill="#6c9c96"/>
<path d="m370 278 61-27v29l-61 26Z" fill="#416d75"/>
<path d="m340 224 29-12 30 12-29 13Z" fill="#ebfff0"/>
<path d="m340 224 30 13v20l-30-12Z" fill="#9ee4c0"/>
<path d="m370 237 29-13v21l-29 12Z" fill="#5fb89f"/>
<ellipse cx="369" cy="216" rx="42" ry="20" fill="#c5ffe1" opacity=".75" filter="url(#blur)"/>
<!-- Trees -->
<g><path d="m199 240 21-9 22 9-21 9Z" fill="#85d3a1"/><path d="m199 240 22 9v31l-22-8Z" fill="#327561"/><path d="m221 249 21-9v32l-21 8Z" fill="#205f60"/><path d="m205 229 16-7 17 7-17 7Z" fill="#9fe0a8"/><path d="m205 229 16 7v13l-16-7Z" fill="#4aa77d"/><path d="m221 236 17-7v13l-17 7Z" fill="#2a866f"/></g>
<g><path d="m497 252 24-10 25 10-24 11Z" fill="#9cdb9f"/><path d="m497 252 25 11v34l-25-10Z" fill="#357761"/><path d="m522 263 24-11v35l-24 10Z" fill="#236965"/><path d="m502 240 20-8 20 8-20 9Z" fill="#b8e5ad"/><path d="m502 240 20 9v15l-20-9Z" fill="#4caa7d"/><path d="m522 249 20-9v15l-20 9Z" fill="#33866d"/></g>
<path d="m118 311 259 106 235-111" fill="none" stroke="#91cfb0" stroke-opacity=".23" stroke-width="2"/>
</svg>
