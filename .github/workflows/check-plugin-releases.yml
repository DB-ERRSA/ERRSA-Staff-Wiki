name: Check compatible plugin releases

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wiki-sync/release-sources.json'
      - 'wiki-sync/check_releases.py'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: errsa-release-snapshot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check approved project releases
        run: python wiki-sync/check_releases.py
      - name: Commit release snapshot only when changed
        id: update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/wiki-sync/latest.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Release snapshot unchanged'
          else
            git commit -m 'Update checked plugin releases'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
      # Pushes made with GITHUB_TOKEN do NOT start the separate Pages workflow.
      # Build and deploy here when the release snapshot actually changes.
      - name: Install MkDocs
        if: steps.update.outputs.changed == 'true'
        run: pip install -r requirements.txt
      - name: Build Staff Wiki
        if: steps.update.outputs.changed == 'true'
        run: mkdocs build --strict
      - name: Configure Pages
        if: steps.update.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload website
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        if: steps.update.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
